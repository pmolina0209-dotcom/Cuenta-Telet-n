<button

box-shadow:0 4px 10px rgba(237,28,46,0.25);

>
📋 COPIAR DATOS BANCARIOS
</button>

</main>
 
 
<script>
 
/*
SOLO SE COPIAN LOS VALORES.
LAS ETIQUETAS NO SE COPIAN.
*/
 
const datosBancarios = `NATHALY IVON
19370505-7
BANCO ESTADO
CUENTA RUT
19370505`;
 
 
async function copiarDatos() {
 
const estado =
document.getElementById("estado");
 
try {
 
await navigator.clipboard.writeText(
datosBancarios
);
 
estado.textContent =
"✅ DATOS COPIADOS CORRECTAMENTE";
 
}
 
catch (error) {
 
estado.textContent = "";
 
}
 
}
 
 
/* BOTÓN DE RESPALDO */
 
document
.getElementById("botonCopiar")
.addEventListener(
"click",
copiarDatos
);
 
 
/* INTENTO AUTOMÁTICO AL ENTRAR */
 
window.addEventListener(
"load",
copiarDatos
);
 
</script>
