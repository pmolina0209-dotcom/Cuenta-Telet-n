<head>

<!-- CABECERA ROJA -->
 
<div style="

text-align:center;
padding:20px;
">
 
<div style="
font-size:26px;
font-weight:bold;
">
Datos bancarios
</div>
 
</div>
 
 
<!-- CONTENIDO -->
 
<div style="
padding:25px 22px 30px 22px;
">
 
 
<div style="
text-align:center;
color:#666666;
font-size:13px;
font-weight:bold;
letter-spacing:1px;
margin-bottom:22px;
">
INFORMACIÓN PARA TRANSFERENCIA
</div>
 
 
<!-- CAJA DE DATOS -->
 
<div style="
background:#f7f7f7;
border-radius:15px;
border-left:6px solid #ed1c2e;
overflow:hidden;
">
 
 
<!-- NOMBRE -->
 
<div style="
padding:15px 17px;
border-bottom:1px solid #dddddd;
">
 
<div style="
color:#777777;
font-size:12px;
font-weight:bold;
margin-bottom:5px;
">
NOMBRE
</div>
 
<div style="
color:#222222;
font-size:18px;
font-weight:bold;
">
NATHALY IVON
</div>
 
</div>
 
 
<!-- RUT -->
 
<div style="
padding:15px 17px;
border-bottom:1px solid #dddddd;
">
 
<div style="
color:#777777;
font-size:12px;
font-weight:bold;
margin-bottom:5px;
">
RUT
</div>
 
<div style="
color:#222222;
font-size:18px;
font-weight:bold;
">
19370505-7
</div>
 
</div>
 
 
<!-- BANCO -->
 
<div style="
padding:15px 17px;
border-bottom:1px solid #dddddd;
">
 
<div style="
color:#777777;
font-size:12px;
font-weight:bold;
margin-bottom:5px;
">
BANCO
</div>
 
<div style="
color:#222222;
font-size:18px;
font-weight:bold;
">
BANCO ESTADO
</div>
 
</div>
 
 
<!-- TIPO DE CUENTA -->
 
<div style="
padding:15px 17px;
border-bottom:1px solid #dddddd;
">
 
<div style="
color:#777777;

font-weight:bold;
margin-bottom:5px;
">
TIPO DE CUENTA
</div>
 
<div style="
color:#222222;
font-size:18px;
font-weight:bold;
">
CUENTA RUT
</div>
 
</div>
 
 
<!-- NÚMERO DE CUENTA -->
 
<div style="
padding:15px 17px;
">
 
<div style="
color:#777777;
font-size:12px;
font-weight:bold;
margin-bottom:5px;
">
NÚMERO DE CUENTA
</div>
 
<div style="
color:#222222;
font-size:18px;
font-weight:bold;
">
19370505
</div>
 
</div>
 
</div>
 
 
<!-- MENSAJE DE COPIA -->
 
<div
id="estado"
style="
min-height:25px;
margin:18px 0 14px 0;
text-align:center;
color:#159447;
font-size:14px;
font-weight:bold;
">
</div>
 
 
<!-- BOTÓN -->
 
<button
id="botonCopiar"
type="button"
 
style="
width:100%;
border:none;
border-radius:14px;
padding:17px 15px;
background:#ed1c2e;
color:#ffffff;
font-family:Arial,Helvetica,sans-serif;
font-size:17px;
font-weight:bold;
cursor:pointer;
box-shadow:0 6px 16px rgba(237,28,46,0.30);
"
>
📋 COPIAR DATOS BANCARIOS
</button>
 
 
</div>
 
</div>
 
 
<script>
 
/*
SOLO ESTOS VALORES SE COPIAN.
 
LAS ETIQUETAS:
NOMBRE
RUT
BANCO
TIPO DE CUENTA
NÚMERO DE CUENTA
 
NO SE COPIAN.
*/
 
const datosBancarios = `NATHALY IVON
19370505-7
BANCO ESTADO
CUENTA RUT
19370505`;
 
 
/* COPIAR */
 
async function copiarDatos() {
 
const estado =
document.getElementById("estado");
 
try {
 
await navigator.clipboard.writeText(
datosBancarios
);
 
estado.textContent =
"✅ DATOS COPIADOS CORRECTAMENTE";
 
}
 
catch (error) {
 
estado.textContent = "";
 
}
 
}
 
 
/* BOTÓN MANUAL */
 
document
.getElementById("botonCopiar")
.addEventListener(
"click",
copiarDatos
);
 
 
/* INTENTO AUTOMÁTICO AL ABRIR */
 
window.addEventListener(
"load",
copiarDatos
);
 
</script>
 
</body>
</html>
