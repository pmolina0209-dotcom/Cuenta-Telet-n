<!-- MENSAJE COPIADO -->
 
<div
id="estado"

text-align:center;
color:#159447;
font-size:9px;
line-height:1.1;
font-weight:600;
"
></div>
 
 
<!-- BOTÓN -->
 
<button
id="botonCopiar"
type="button"
 
style="
display:block;
width:100%;
box-sizing:border-box;
border:none;
border-radius:9px;
padding:9px 8px;
background:#ed1c2e;
color:#ffffff;
font-family:Arial,Helvetica,sans-serif;
font-size:12px;
line-height:1;
font-weight:700;
cursor:pointer;
box-shadow:0 3px 9px rgba(237,28,46,0.25);
"
>
 
📋 COPIAR DATOS BANCARIOS
 
</button>
 
 
</div>
 
</main>
 
 
<script>
 
 
/*
==================================
DATOS QUE SE COPIAN
SIN ETIQUETAS
==================================
*/
 
const datosBancarios = `NATHALY IVON
19370505-7
BANCO ESTADO
CUENTA RUT
19370505`;
 
 
/*
==================================
FUNCIÓN COPIAR
==================================
*/
 
async function copiarDatos() {
 
const estado =
document.getElementById("estado");
 
try {
 
await navigator.clipboard.writeText(
datosBancarios
);
 
estado.textContent =
"✅ DATOS COPIADOS CORRECTAMENTE";
 
}
 
catch (error) {
 
estado.textContent = "";
 
}
 
}
 
 
/*
==================================
BOTÓN MANUAL
==================================
*/
 
document
.getElementById("botonCopiar")
.addEventListener(
"click",
copiarDatos
);
 
 
/*
==================================
INTENTO DE COPIA AUTOMÁTICA
==================================
*/
 
window.addEventListener(
"load",
copiarDatos
);
 
 
</script>
