<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ef3340">
 
<title>Datos bancarios</title>
 
<style>
* {
box-sizing: border-box;
}
 
body {
margin: 0;
min-height: 100vh;
padding: 15px;
 
display: flex;
justify-content: center;
align-items: center;
 
font-family: Arial, Helvetica, sans-serif;
 
background: linear-gradient(
145deg,
#ffffff,
#eeeeee
);
 
color: #1c1c1c;
}
 
.tarjeta {
width: 100%;
max-width: 430px;
 
background: #ffffff;
 
border-radius: 24px;
overflow: hidden;
 
border: 1px solid #e8e8e8;
 
box-shadow:
0 16px 45px rgba(0, 0, 0, 0.18);
}
 
/* LOGO */
 
.logo-container {
background: #ffffff;
 
padding: 25px 20px 20px;
 
text-align: center;
}
 
.logo {
display: block;
 
width: 190px;
max-width: 65%;
 
height: auto;
 
margin: 0 auto;
}
 
/* CABECERA */
 
.cabecera {
padding: 18px 20px;
 
text-align: center;
 
color: #ffffff;
 
background: linear-gradient(
135deg,
#ef3340,
#d92736
);
}
 
.cabecera h1 {
margin: 0;
 
font-size: 25px;
font-weight: bold;
}
 
/* CONTENIDO */
 
.contenido {
padding: 26px 22px 30px;
}
 
.subtitulo {
margin-bottom: 20px;
 
text-align: center;
 
color: #666666;
 
font-size: 13px;
font-weight: bold;
 
letter-spacing: 1px;
 
text-transform: uppercase;
}
 
/* DATOS */
 
.datos {
overflow: hidden;
 
background: #f7f7f7;
 
border-left: 5px solid #ef3340;
 
border-radius: 14px;
}
 
.fila {
padding: 14px 16px;
 
border-bottom: 1px solid #dddddd;
}
 
.fila:last-child {
border-bottom: none;
}
 
/* ETIQUETAS */
 
.etiqueta {
display: block;
 
margin-bottom: 5px;
 
color: #777777;
 
font-size: 12px;
font-weight: bold;
 
text-transform: uppercase;
}
 
/* VALORES */
 
.valor {
display: block;
 
color: #1c1c1c;
 
font-size: 18px;
font-weight: bold;
}
 
/* RESULTADO DE LA COPIA */
 
#estado {
min-height: 26px;
 
margin: 18px 0 15px;
 
text-align: center;
 
color: #2e7d32;
 
font-size: 15px;
font-weight: bold;
}
 
/* BOTÓN */
 
#botonCopiar {
width: 100%;
 
padding: 17px 18px;
 
border: none;
border-radius: 14px;
 
background: linear-gradient(
135deg,
#ef3340,
#d92736
);
 
color: #ffffff;
 
font-size: 17px;
font-weight: bold;
 
cursor: pointer;
 
box-shadow:
0 7px 18px rgba(239, 51, 64, 0.28);
}
 
#botonCopiar:hover {
filter: brightness(1.05);
}
 
#botonCopiar:active {
transform: scale(0.98);
}
 
/* MÓVIL */
 
@media (max-width: 480px) {
body {
padding: 10px;
}
 
.tarjeta {
border-radius: 20px;
}
 
.logo {
width: 165px;
}
 
.cabecera h1 {
font-size: 22px;
}
 
.contenido {
padding: 23px 18px 26px;
}
 
.valor {
font-size: 17px;
}
}
</style>
</head>
 
<body>
 
<main class="tarjeta">
 
<!-- LOGO -->
 
<div class="logo-container">
<img
src="LOGO.png"
alt="Logo"
class="logo"
>
</div>
 
 
<!-- CABECERA -->
 
<div class="cabecera">
<h1>Datos bancarios</h1>
</div>
 
 
<!-- CONTENIDO -->
 
<div class="contenido">
 
<div class="subtitulo">
Información para transferencia
</div>
 
 
<!-- DATOS VISIBLES -->
 
<div class="datos">
 
<div class="fila">
<span class="etiqueta">
Nombre
</span>
 
<span class="valor">
NATHALY IVON
</span>
</div>
 
 
<div class="fila">
<span class="etiqueta">
RUT
</span>
 
<span class="valor">
19370505-7
</span>
</div>
 
 
<div class="fila">
<span class="etiqueta">
Banco
</span>
 
<span class="valor">
BANCO ESTADO
</span>
</div>
 
 
<div class="fila">
<span class="etiqueta">
Tipo de cuenta
</span>
 
<span class="valor">
CUENTA RUT
</span>
</div>
 
 
<div class="fila">
<span class="etiqueta">
Número de cuenta
</span>
 
<span class="valor">
19370505
</span>
</div>
 
</div>
 
 
<!-- MENSAJE SOLO CUANDO SE COPIA -->
 
<div id="estado"></div>
 
 
<!-- BOTÓN -->
 
<button
id="botonCopiar"
type="button"
>
📋 COPIAR DATOS BANCARIOS
</button>
 
</div>
 
</main>
 
 
<script>
 
/*
SOLO ESTOS DATOS SE COPIAN.
NO SE COPIAN LAS ETIQUETAS.
*/
 
const datosBancarios = `NATHALY IVON
19370505-7
BANCO ESTADO
CUENTA RUT
19370505`;
 
 
async function copiarDatos() {
 
const estado =
document.getElementById("estado");
 
try {
 
await navigator.clipboard.writeText(
datosBancarios
);
 
estado.textContent =
"✅ DATOS COPIADOS CORRECTAMENTE";
 
} catch (error) {
 
/*
Si la copia automática es bloqueada,
no mostramos ningún mensaje.
El botón permanece disponible.
*/
 
estado.textContent = "";
 
}
 
}
 
 
/*
COPIA MANUAL MEDIANTE EL BOTÓN
*/
 
document
.getElementById("botonCopiar")
.addEventListener(
"click",
copiarDatos
);
 
 
/*
INTENTO DE COPIA AUTOMÁTICA
AL ABRIR LA PÁGINA
*/
 
window.addEventListener(
"load",
copiarDatos
);
 
</script>
 
</body>
</html>
