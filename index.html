<!-- BOTÓN -->
 
<button
id="botonCopiar"
type="button"
style="

width:100%;
box-sizing:border-box;
border:none;
border-radius:13px;
padding:16px 12px;
background:#ed1c2e;

font-family:Arial,Helvetica,sans-serif;
font-size:16px;
line-height:1.2;
font-weight:bold;
cursor:pointer;
box-shadow:0 6px 16px rgba(237,28,46,0.28);
"
>
📋 COPIAR DATOS BANCARIOS
</button>

</main>
 
 
<script>
 
const datosBancarios = `NATHALY IVON
19370505-7
BANCO ESTADO
CUENTA RUT
19370505`;
 
 
/* COPIAR DATOS */
 
async function copiarDatos() {
 
const estado =
document.getElementById("estado");
 
try {
 
await navigator.clipboard.writeText(
datosBancarios
);
 
estado.textContent =
"✅ DATOS COPIADOS CORRECTAMENTE";
 
}
 
catch (error) {
 
estado.textContent = "";
 
}
 
}
 
 
/* BOTÓN MANUAL */
 
document
.getElementById("botonCopiar")
.addEventListener(
"click",
copiarDatos
);
 
 
/* INTENTO AUTOMÁTICO */
 
window.addEventListener(
"load",
copiarDatos
);
 
</script>
